name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet python-docx
      - name: Tool tests
        run: |
          for dir in tools/loi-generator tools/velocity-check tools/velocity-radar; do
            (cd "$dir" && python -m unittest discover -s tests)
          done
      - name: Refresh script tests
        run: python -m unittest discover -s scripts/tests
